name: PR Quality Gates

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

concurrency:
  group: pr-quality-gates-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-and-test:
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      SIGNING_STORE_PASSWORD: ci
      SIGNING_KEY_ALIAS: ci
      SIGNING_KEY_PASSWORD: ci
      UPLOAD_SIGNING_STORE_PASSWORD: ci
      UPLOAD_SIGNING_KEY_ALIAS: ci
      UPLOAD_SIGNING_KEY_PASSWORD: ci
      CURRENT_DATE: 1970-01-01
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Set up Java 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "build-tools;35.0.0" "platforms;android-35"
      - name: Create local.properties for CI
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
      - name: Build debug and run unit tests
        run: ./gradlew --no-daemon :mastodon:assembleDebug :mastodon:testDebugUnitTest -x lint
